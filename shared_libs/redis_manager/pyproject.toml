[project]
name = "redis-manager"
version = "0.1.0"
description = "Менеджер Redis"
authors = [
    {name = "Nikita Bondarev",email = "nikitabondarevvitebsk@gmail.com"}
]
license = "No license (Для внутреннего пользования)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "redis (<6.0)",
    "arq[redis] (>=0.28.0,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
