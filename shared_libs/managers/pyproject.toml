[project]
name = "managers"
version = "0.1.0dev0"
description = "Менеджеры для сервисов"
authors = [
    { name = "Nikita Bondarev", email = "nikitabondarevvitebsk@gmail.com" }
]
license = "No license (Для внутреннего пользования)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "cryptography (>=50.0.1,<51.0.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "redis (<6.0)",
    "arq (>=0.28.0,<0.29.0)",
    "watchfiles (>=1.2.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C", "N", "UP", "B", "A", "SIM", "ARG", "PT"]

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)"
]
